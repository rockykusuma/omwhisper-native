name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # macOS 26 required (SpeechTranscriber / Foundation Models APIs, ENABLE_APP_SANDBOX=NO
    # target). If GitHub has not yet published a `macos-26` runner image when this runs,
    # fall back to `macos-latest` temporarily — but note the build may fail on SDK-gated APIs.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode / SDK version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project omwhisper-native.xcodeproj \
            -scheme OmWhisper \
            -destination 'platform=macOS' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild \
            -project omwhisper-native.xcodeproj \
            -scheme OmWhisper \
            -destination 'platform=macOS' \
            test \
            CODE_SIGNING_ALLOWED=NO
