		96BBE0702FFD24AC00EE67CF /* Patch Info.plist (custom third-party keys) */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Patch Info.plist (custom third-party keys)";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# GENERATE_INFOPLIST_FILE's INFOPLIST_KEY_* synthesis only recognizes\n# Apple's own known keys (LSUIElement, NS*UsageDescription, etc.) -- a\n# third-party key like SUFeedURL is silently dropped even though the\n# build setting itself resolves fine. Patch it in directly instead.\n# NSAudioCaptureUsageDescription hits the same gap -- confirmed empirically\n# (PlistBuddy Print came back \"Does Not Exist\" despite the build setting\n# being set), even though it's a first-party Apple TCC key -- this Xcode's\n# synthesis list just doesn't include it yet.\nPLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\n/usr/libexec/PlistBuddy -c \"Delete :SUFeedURL\" \"$PLIST\" 2>/dev/null\n/usr/libexec/PlistBuddy -c \"Add :SUFeedURL string ${INFOPLIST_KEY_SUFeedURL}\" \"$PLIST\"\n/usr/libexec/PlistBuddy -c \"Delete :SUPublicEDKey\" \"$PLIST\" 2>/dev/null\n/usr/libexec/PlistBuddy -c \"Add :SUPublicEDKey string ${INFOPLIST_KEY_SUPublicEDKey}\" \"$PLIST\"\n/usr/libexec/PlistBuddy -c \"Delete :NSAudioCaptureUsageDescription\" \"$PLIST\" 2>/dev/null\n/usr/libexec/PlistBuddy -c \"Add :NSAudioCaptureUsageDescription string ${INFOPLIST_KEY_NSAudioCaptureUsageDescription}\" \"$PLIST\"\n";
		};
/* End PBXShellScriptBuildPhase section */

